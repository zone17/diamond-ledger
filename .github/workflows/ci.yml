name: CI

# Advisory CI gate. On a private free-plan repo, server-side required status
# checks are unavailable, so this pipeline informs review rather than hard-blocking
# merges; branch/commit discipline is enforced by local hooks (see CONTRIBUTING.md
# and DECISIONS.md ADR-0002). Each job maps to a row in the constitution's
# Enforcement Matrix (.specify/memory/constitution.md).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege by default (Article XXVI).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Constitution & decisions integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Constitution present and well-formed (Articles XVI, XL)
        run: |
          set -euo pipefail
          CON=.specify/memory/constitution.md
          test -f "$CON" || { echo "::error::constitution missing at $CON"; exit 1; }
          grep -Eq '^\*\*Version\*\*: [0-9]+\.[0-9]+\.[0-9]+' "$CON" \
            || { echo "::error::constitution missing a semantic **Version**: X.Y.Z line"; exit 1; }
          grep -q 'North Star' "$CON" \
            || { echo "::error::constitution missing its North Star"; exit 1; }
          echo "OK: $(grep -E '^\*\*Version\*\*:' "$CON")"
      - name: DECISIONS.md present (Article XXXVIII)
        run: test -f DECISIONS.md || { echo "::error::DECISIONS.md missing"; exit 1; }

  branch-name:
    name: Branch naming (Article XVIII)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate typed squad branch {type}/{squad}/{ticket}-{slug}
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|docs|refactor|chore|ci|test|perf|build|spike)/[a-z0-9-]+/[A-Z]+-[0-9]+-[a-z0-9-]+$'
          if [[ "$BRANCH" =~ $PATTERN ]]; then
            echo "OK: '$BRANCH' matches {type}/{squad}/{ticket}-{slug}"
          else
            echo "::error::Branch '$BRANCH' must match {type}/{squad}/{ticket}-{slug}," \
                 "e.g. feat/platform/PLAT-142-record-pitch-tool"
            exit 1
          fi

  secret-scan:
    name: Secret scan + privacy gate (Articles XXVI, XXXVI / T070 / FR-022)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source=/repo --redact -v

      # T070 / FR-022 / COPPA — HARD-FAIL.
      # Scans core/, ios/, adapters/, android/ for any code path that writes raw PCM
      # audio to disk, a database, telemetry, or any persistent sink.
      # Script: scripts/check-no-raw-audio.sh
      # Step 1 (--self-test): verifies the patterns themselves catch all known violation
      #   idioms and do not fire on clean code. Fails fast if a pattern is broken.
      # Step 2 (main scan): scans the repo source. A match exits 1 with ::error:: annotations.
      # Do NOT add continue-on-error here — this is a non-negotiable privacy gate.
      - name: Privacy gate — no raw-audio persistence (T070 / FR-022 / COPPA)
        run: |
          set -euo pipefail
          echo "=== Step 1: self-test (verify patterns are functional) ==="
          bash scripts/check-no-raw-audio.sh --self-test
          echo ""
          echo "=== Step 2: scan repo source ==="
          bash scripts/check-no-raw-audio.sh "${GITHUB_WORKSPACE}"

  hooks-test:
    name: Compound-loop hooks (ADR-0003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run compound-hook regression tests
        run: bash .claude/hooks/test-compound-hooks.sh

  # ---------------------------------------------------------------------------
  # Retrosheet / cwevent 3-layer gate (T059 / T060 — Squad C, DL-103)
  #
  # REAL gate: builds pinned cwevent v0.10.0 from SHA256-verified tarball
  # (autotools, Linux CI), then runs evals/runners/retrosheet-gate.sh against
  # evals/retrosheet-fixtures/.
  #
  # CRITICAL (research.md D4): cwevent exits 0 even on malformed plays.
  # The gate is STDERR-driven — fails on WARNING|Invalid|Can't find|could not open
  # OR zero event rows emitted. Never gate on exit code alone.
  #
  # continue-on-error removed: this job is now a hard gate (C1/T059/T060 wired).
  # ---------------------------------------------------------------------------
  retrosheet-gate:
    name: Retrosheet / cwevent 3-layer gate (D4 / T059 / T060)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install autotools (for cwevent build)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends autoconf automake libtool make gcc

      - name: Build pinned Chadwick cwevent v0.10.0 (T059)
        # SHA256: a4128934286edf5f9938923aad2000f7549dcccfb3b3f149a417534ef7eb29e9
        # Re-check for newer tag before locking: v0.10.0 confirmed latest as of 2026-06-01
        # (no v0.11.x exists — checked github.com/chadwickbureau/chadwick/releases)
        run: |
          set -euo pipefail
          TARBALL_URL="https://github.com/chadwickbureau/chadwick/releases/download/v0.10.0/chadwick-0.10.0.tar.gz"
          EXPECTED_SHA256="a4128934286edf5f9938923aad2000f7549dcccfb3b3f149a417534ef7eb29e9"
          INSTALL_PREFIX="${HOME}/chadwick"

          echo "=== Downloading Chadwick v0.10.0 tarball ==="
          curl -fsSL -o /tmp/chadwick.tar.gz "$TARBALL_URL"

          echo "=== Verifying SHA256 ==="
          ACTUAL_SHA256="$(sha256sum /tmp/chadwick.tar.gz | awk '{print $1}')"
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::SHA256 mismatch!"
            echo "  Expected: $EXPECTED_SHA256"
            echo "  Actual:   $ACTUAL_SHA256"
            exit 1
          fi
          echo "SHA256 verified: $ACTUAL_SHA256"

          echo "=== Building cwevent (autotools) ==="
          mkdir -p /tmp/chadwick-src
          tar xzf /tmp/chadwick.tar.gz -C /tmp/chadwick-src --strip-components=1
          cd /tmp/chadwick-src
          ./configure --prefix="$INSTALL_PREFIX" --disable-shared --enable-static \
            CFLAGS="-O2" 2>&1 | tail -5
          make -j"$(nproc)" 2>&1 | tail -5
          make install 2>&1 | tail -3

          echo "=== Verifying cwevent binary ==="
          CWEVENT="${INSTALL_PREFIX}/bin/cwevent"
          # cwevent exits 1 when no args/files are given; capture stderr output first
          CWEVENT_HEADER="$("$CWEVENT" 2>&1; true)"
          CWEVENT_VER="$(echo "$CWEVENT_HEADER" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [[ "$CWEVENT_VER" != "0.10.0" ]]; then
            echo "::error::cwevent version mismatch: expected 0.10.0, got '$CWEVENT_VER'"
            echo "Binary header: $CWEVENT_HEADER"
            exit 1
          fi
          echo "cwevent $CWEVENT_VER built and verified ✓"
          echo "CWEVENT_BIN=${INSTALL_PREFIX}/bin" >> "$GITHUB_ENV"

      - name: Run 3-layer retrosheet gate (T060)
        # Layer 2 (authoritative): STDERR-driven — fails on WARNING|Invalid|Can't find|could not open
        # Layer 3: golden diff vs committed expected.csv
        # Layer 1: proof-box.sh deferred (Squad A T043 — depends on Rust core)
        run: |
          set -euo pipefail
          export PATH="${CWEVENT_BIN}:${PATH}"
          echo "=== Running retrosheet-gate.sh against evals/retrosheet-fixtures/ ==="
          for FIXTURE_DIR in evals/retrosheet-fixtures/*/; do
            YEAR="$(basename "$FIXTURE_DIR")"
            # Skip non-year directories (e.g., malformed/ for negative tests)
            if [[ "$YEAR" =~ ^[0-9]{4}$ ]]; then
              echo "--- Fixture: $FIXTURE_DIR (year $YEAR) ---"
              bash evals/runners/retrosheet-gate.sh "$FIXTURE_DIR" "$YEAR"
            fi
          done

      - name: Negative test — malformed fixture MUST trip the gate (T062)
        # The malformed fixture contains an invalid record type that triggers
        # a stderr WARNING. This step verifies the gate correctly FAILS on it.
        run: |
          set -euo pipefail
          export PATH="${CWEVENT_BIN}:${PATH}"
          echo "=== Negative test: malformed fixture must fail the gate ==="
          if bash evals/runners/retrosheet-gate.sh evals/retrosheet-fixtures/malformed 2024; then
            echo "::error::Negative test FAILED: malformed fixture should have tripped the gate but did not"
            exit 1
          else
            echo "OK: malformed fixture correctly FAILED the gate ✓"
          fi

  # ---------------------------------------------------------------------------
  # H2 export gate: SC-004 end-to-end proof (DL-36 / FR-016 / I4)
  #
  # HARD GATE — cwevent is installed in this job; h2-export.sh exits 2 only when
  # cwevent is missing (skip-with-note), exits 1 on a genuine malformed export (hard
  # fail), exits 0 on SC-004 GREEN. The CI step re-raises exit 2 as 0 (skip) and
  # re-raises exit 1 as 1 (hard fail). `continue-on-error` is intentionally absent
  # — a genuine malformed export MUST block the PR (matching retrosheet-gate behavior).
  # Run locally with: bash evals/runners/h2-export.sh
  # ---------------------------------------------------------------------------
  h2-export-gate:
    name: SC-004 H2 export gate — real core → cwevent (DL-36 / FR-016)
    runs-on: ubuntu-latest
    # Depends on core-build so Rust toolchain cache is warm.
    needs: [retrosheet-gate, core-build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install pinned Rust toolchain
        run: |
          if [ -f rust-toolchain.toml ]; then
            rustup show
          fi
      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-host-
      - name: Install Chadwick cwevent v0.10.0 (SHA256-pinned)
        run: |
          set -euo pipefail
          TARBALL_URL="https://github.com/chadwickbureau/chadwick/releases/download/v0.10.0/chadwick-0.10.0.tar.gz"
          EXPECTED_SHA256="a4128934286edf5f9938923aad2000f7549dcccfb3b3f149a417534ef7eb29e9"
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends autoconf automake libtool make gcc
          curl -fsSL -o /tmp/chadwick.tar.gz "$TARBALL_URL"
          ACTUAL_SHA256="$(sha256sum /tmp/chadwick.tar.gz | awk '{print $1}')"
          [[ "$ACTUAL_SHA256" == "$EXPECTED_SHA256" ]] || { echo "::error::SHA256 mismatch"; exit 1; }
          mkdir -p /tmp/chadwick-src
          tar xzf /tmp/chadwick.tar.gz -C /tmp/chadwick-src --strip-components=1
          cd /tmp/chadwick-src && ./configure --prefix="${HOME}/chadwick" --disable-shared CFLAGS="-O2" 2>&1 | tail -3
          make -j"$(nproc)" 2>&1 | tail -3 && make install 2>&1 | tail -2
          echo "CWEVENT_BIN=${HOME}/chadwick/bin" >> "$GITHUB_ENV"
      - name: SC-004 H2 export gate (evals/runners/h2-export.sh)
        run: |
          set -euo pipefail
          export PATH="${CWEVENT_BIN}:${PATH}"
          # Exit 2 = cwevent not available → skip-with-note (not a hard failure)
          bash evals/runners/h2-export.sh || EC=$?
          if [[ "${EC:-0}" -eq 2 ]]; then
            echo "::notice::cwevent not available — SC-004 h2-export gate skipped (advisory)"
            exit 0
          fi
          exit "${EC:-0}"

  # ---------------------------------------------------------------------------
  # Corpus validity check (T063 — Squad C)
  #
  # Validates that evals/judgment-corpus/corpus.jsonl conforms to INTERFACE.md v1.1:
  # all 4 trigger types covered, no duplicate IDs, EarnedVsUnearned entries have
  # inning_error_context, expected_classification is Judgment variant.
  # ---------------------------------------------------------------------------
  corpus-validity:
    name: Judgment corpus validity (T063 / INTERFACE.md v1.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Validate corpus.jsonl
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import json, sys
          from collections import Counter

          REQUIRED_KEYS = {"id", "situation", "catalyst", "supplied_label",
                           "expected_classification", "trigger", "source"}
          VALID_TRIGGERS = {"HitVsError", "EarnedVsUnearned", "ContestedCredit", "AmbiguousAdvance"}
          VALID_CLASSIFICATIONS = {
              "Judgment(HitVsError)", "Judgment(EarnedVsUnearned)",
              "Judgment(ContestedCredit)", "Judgment(AmbiguousAdvance)"
          }

          ids = set()
          triggers_seen = set()
          errors = []

          corpus_file = "evals/judgment-corpus/corpus.jsonl"
          seed_file = "evals/judgment-corpus/seed.jsonl"

          # Collect all IDs from seed to check uniqueness across files
          seed_ids = set()
          try:
              with open(seed_file) as f:
                  for line in f:
                      line = line.strip()
                      if line:
                          entry = json.loads(line)
                          seed_ids.add(entry.get("id", ""))
          except FileNotFoundError:
              pass  # seed.jsonl is Squad A's artifact

          with open(corpus_file) as f:
              entries = [json.loads(l.strip()) for l in f if l.strip()]

          if not entries:
              print("::error::corpus.jsonl is empty — must have at least one entry")
              sys.exit(1)

          for lineno, entry in enumerate(entries, 1):
              eid = entry.get("id", f"(no id, line {lineno})")

              missing = REQUIRED_KEYS - entry.keys()
              if missing:
                  errors.append(f"{eid}: missing required keys: {missing}")

              if eid in ids or eid in seed_ids:
                  errors.append(f"{eid}: duplicate ID (also in seed or corpus)")
              ids.add(eid)

              ec = entry.get("expected_classification", "")
              if ec not in VALID_CLASSIFICATIONS:
                  errors.append(f"{eid}: invalid expected_classification: '{ec}'")

              trigger = entry.get("trigger", "")
              if trigger not in VALID_TRIGGERS:
                  errors.append(f"{eid}: invalid trigger: '{trigger}'")
              else:
                  triggers_seen.add(trigger)

              if trigger and ec and f"Judgment({trigger})" != ec:
                  errors.append(f"{eid}: trigger '{trigger}' disagrees with classification '{ec}'")

              if trigger == "EarnedVsUnearned" and "inning_error_context" not in entry:
                  errors.append(f"{eid}: EarnedVsUnearned entry missing inning_error_context (INTERFACE.md §1.1)")

          missing_triggers = VALID_TRIGGERS - triggers_seen
          if missing_triggers:
              errors.append(f"Missing trigger types: {missing_triggers} — all 4 must be covered (INTERFACE.md §1.2 rule 3)")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)

          counts = Counter(e["trigger"] for e in entries)
          print(f"corpus.jsonl VALID: {len(entries)} entries")
          for t in sorted(VALID_TRIGGERS):
              print(f"  {t}: {counts[t]} entries")
          PYEOF

  # ---------------------------------------------------------------------------
  # Rust core — build, test, clippy, UniFFI surface (ENFORCING)
  # ---------------------------------------------------------------------------

  core-build:
    name: Rust core — cargo check + tests (ADR-0007 / T002 / T016)
    runs-on: ubuntu-latest
    # ENFORCING (DL-104): the core compiles + tests + clippy(-D warnings) are green on
    # main; this is now a hard gate. `make demo` runs the same checks locally.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install pinned Rust toolchain
        # Reads the channel from the repo-root rust-toolchain.toml (workspace root).
        run: |
          if [ -f rust-toolchain.toml ]; then
            rustup show
          else
            echo "rust-toolchain.toml not yet present — skipping toolchain install (placeholder)"
          fi
      - name: Cache cargo registry and build artefacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-host-
      - name: cargo check (integer/fixed-point core, no f32/f64)
        # Checks the whole workspace (core + adapters) from the repo-root Cargo.toml.
        run: |
          if [ -f Cargo.toml ]; then
            cargo check --workspace
          else
            echo "Cargo.toml (workspace root) not yet present — skipping cargo check (placeholder)"
          fi
      - name: cargo test (unit + integration tests)
        # T016: no-float determinism + contract tests (arts. X/XI).
        run: |
          if [ -f Cargo.toml ]; then
            cargo test --workspace 2>&1
          else
            echo "Cargo.toml not yet present — skipping cargo test (placeholder)"
          fi
      - name: clippy no-float gate (T016 — FR-003 / I6) — HARD-FAIL
        # Enforces no f32/f64 in core/ — determinism invariant.
        # Reads deny rules from clippy.toml at workspace root.
        # This step has NO continue-on-error: a clippy warning is a CI failure.
        run: |
          if [ -f Cargo.toml ] && [ -f clippy.toml ]; then
            cargo clippy --workspace --all-targets -- -D warnings 2>&1
          else
            echo "clippy.toml or Cargo.toml not present — no-float gate advisory (placeholder)"
          fi
      - name: UniFFI surface compiles + no-float holds with the feature (T037 / H1) — HARD-FAIL
        # The FFI boundary types + the exported DiamondCore impl must compile under the
        # uniffi feature AND still pass the no-float clippy gate (the integer-only seam).
        run: |
          if [ -f Cargo.toml ]; then
            cargo build -p dl-core --features uniffi
            cargo clippy -p dl-core --features uniffi --all-targets -- -D warnings
          fi
      - name: UniFFI Swift bindings generate non-empty (T037 — cache-pitfall guard)
        # Rebuilds the host dylib WITH the feature, then generates Swift bindings and
        # asserts they are non-empty. Catches the silent cache pitfall where a non-uniffi
        # dylib makes bindgen emit zero files. (Full XCFramework needs Xcode — macOS only.)
        run: |
          if [ -f Cargo.toml ]; then
            make uniffi-bindings
          fi

  # ---------------------------------------------------------------------------
  # Multi-target cross-compile matrix (T068 / #112 — ADR-0007 UniFFI parity)
  #
  # Builds dl-core with --features uniffi across all UniFFI-targeted platforms:
  #   - host (ubuntu) — already covered by core-build; included for matrix symmetry
  #   - iOS device:    aarch64-apple-ios     (cross-compile; needs macOS runner)
  #   - iOS simulator: aarch64-apple-ios-sim (cross-compile; needs macOS runner)
  #   - Android arm64: aarch64-linux-android (cross-compile via NDK)
  #   - Android armv7: armv7-linux-androideabi (cross-compile via NDK)
  #   - WASM:          wasm32-unknown-unknown (no_std-compatible feature subset)
  #
  # iOS targets (aarch64-apple-ios, aarch64-apple-ios-sim):
  #   macOS runner with Xcode. These jobs compile the Rust → static lib only;
  #   the XCFramework assembly (lipo + xcframework) is advisory (ios-build job).
  #
  # Android targets (aarch64-linux-android, armv7-linux-androideabi):
  #   Ubuntu runner + Android NDK (pre-installed on GitHub's ubuntu-latest).
  #   cargo-ndk is installed at job start to manage linker config.
  #
  # WASM (wasm32-unknown-unknown):
  #   Ubuntu runner + wasm-pack or plain rustup target add.
  #   The uniffi feature is intentionally NOT applied to WASM — UniFFI's generated
  #   Swift/Kotlin glue has no meaning in a WASM context, and the proc-macro
  #   dependencies may not support wasm32-unknown-unknown. The core crate itself
  #   (no-float, no-std-compatible logic) is what we prove compiles for WASM.
  #
  # GATE SEMANTICS:
  #   All matrix legs are HARD-FAILs (no continue-on-error) EXCEPT:
  #   - ios-device (aarch64-apple-ios) and ios-sim (aarch64-apple-ios-sim) remain
  #     advisory for now because the build may not be green without the full Xcode
  #     SDK and the real device/sim target on all macOS versions. Promoted to hard
  #     once a macOS runner with the iOS SDK passes cleanly.
  #
  # Cache strategy: separate cache key per target triple to avoid cross-contamination.
  # ---------------------------------------------------------------------------
  cross-compile-matrix:
    name: Cross-compile dl-core (${{ matrix.target }})
    needs: [core-build]
    strategy:
      fail-fast: false  # let all legs run; report all failures at once
      matrix:
        include:
          # ── Android ──────────────────────────────────────────────────────────
          - target: aarch64-linux-android
            runner: ubuntu-latest
            label: Android arm64
            use_ndk: true
            advisory: false
          - target: armv7-linux-androideabi
            runner: ubuntu-latest
            label: Android armv7
            use_ndk: true
            advisory: false
          # ── WASM ─────────────────────────────────────────────────────────────
          # Core logic only (no UniFFI feature — UniFFI has no WASM surface);
          # verifies the integer-only, no-std-compatible core compiles to WASM.
          - target: wasm32-unknown-unknown
            runner: ubuntu-latest
            label: WASM (core, no uniffi feature)
            use_ndk: false
            advisory: false
          # ── iOS (advisory — GitHub runners lack the iOS-26 SDK; see ios-build) ──
          # To promote to hard gate: provision a self-hosted macOS runner with
          # Xcode 26.x (iOS 26 SDK), or wait for GitHub to ship the image.
          # The ios-build job (xcodebuild) remains separately advisory; these
          # legs only prove the Rust cross-compile itself works.
          - target: aarch64-apple-ios
            runner: macos-latest
            label: iOS device (advisory — no iOS-26 SDK on runner)
            use_ndk: false
            advisory: true
          - target: aarch64-apple-ios-sim
            runner: macos-latest
            label: iOS simulator (advisory — no iOS-26 SDK on runner)
            use_ndk: false
            advisory: true
    runs-on: ${{ matrix.runner }}
    # continue-on-error supports ${{ matrix.* }} expressions at job level (supported since
    # GitHub Actions Sep 2022 — https://github.blog/changelog/2022-09-08-github-actions-improvements-to-reusable-workflows-2/).
    # Advisory legs (matrix.advisory == true) absorb failures so they cannot block a merge.
    # Hard legs (matrix.advisory == false) propagate failures normally.
    continue-on-error: ${{ matrix.advisory }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install pinned Rust toolchain
        run: |
          if [ -f rust-toolchain.toml ]; then
            rustup show
          else
            echo "rust-toolchain.toml not present — using stable (placeholder)"
            rustup toolchain install stable --profile minimal
          fi

      - name: Add cross-compile target — ${{ matrix.target }}
        env:
          CROSS_TARGET: ${{ matrix.target }}
        run: rustup target add "$CROSS_TARGET"

      - name: Cache cargo (target-specific)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      # ── Android: install cargo-ndk + configure NDK linker ───────────────────
      - name: Install cargo-ndk (Android only)
        if: matrix.use_ndk
        run: |
          set -euo pipefail
          # GitHub ubuntu-latest ships Android NDK at $ANDROID_NDK_ROOT
          if [[ -z "${ANDROID_NDK_ROOT:-}" ]]; then
            echo "::error::ANDROID_NDK_ROOT not set — expected on ubuntu-latest"
            exit 1
          fi
          echo "Using Android NDK at: ${ANDROID_NDK_ROOT}"
          # cargo-ndk handles linker selection and sysroot setup.
          # Pin to a known-good release (v3.5.4 as of 2026-06-01).
          cargo install cargo-ndk --version 3.5.4 --locked

      # ── Build step ──────────────────────────────────────────────────────────
      - name: Build dl-core for ${{ matrix.target }}
        env:
          # Pass matrix values through env vars — never interpolate into run: shell text.
          # matrix.target and matrix.use_ndk are workflow-internal constants, but the
          # safe pattern (ADR-0002 / Article XXVI) routes all expressions through env:.
          CROSS_TARGET: ${{ matrix.target }}
          USE_NDK: ${{ matrix.use_ndk }}
        run: |
          set -euo pipefail
          if [ ! -f Cargo.toml ]; then
            echo "Cargo.toml not present — skipping cross-compile (placeholder)"
            exit 0
          fi

          TARGET="$CROSS_TARGET"

          if [[ "$TARGET" == "wasm32-unknown-unknown" ]]; then
            # WASM: no UniFFI feature (proc-macros may not support wasm32).
            # Build the core crate with default features (no-float, pure logic).
            echo "=== Building dl-core for WASM (no uniffi feature) ==="
            cargo build -p dl-core --target wasm32-unknown-unknown

          elif [[ "$USE_NDK" == "true" ]]; then
            # Android: use cargo-ndk for linker configuration.
            echo "=== Building dl-core for $TARGET via cargo-ndk ==="
            cargo ndk --target "$TARGET" build -p dl-core --features uniffi

          else
            # iOS (aarch64-apple-ios / aarch64-apple-ios-sim): plain cross-compile.
            # These produce a static lib; XCFramework assembly is a separate step
            # (scripts/build-xcframework.sh / make xcframework) that needs Xcode.
            echo "=== Building dl-core for $TARGET (static lib, no xcframework) ==="
            cargo build -p dl-core --target "$TARGET" --features uniffi

          fi

      # ── Report advisory status ───────────────────────────────────────────────
      # Advisory legs emit a visible notice so the summary shows they were skipped/warned
      # rather than silently passing. Hard legs do not need this step.
      - name: Annotate advisory result
        if: matrix.advisory
        env:
          CROSS_TARGET: ${{ matrix.target }}
        run: |
          echo "::notice title=Advisory (${CROSS_TARGET})::This cross-compile leg is advisory." \
               "To promote to a hard gate, provision a macOS runner with the iOS-26 SDK" \
               "(Xcode 26.x) and remove continue-on-error from this matrix entry (T068)."

  core-eval:
    name: Rust core — eval harness (T040/T041/T042/T043)
    runs-on: ubuntu-latest
    # ENFORCING: SC-003 judgment (T041), proof-box Layer-1 (T043), and parity SC-008
    # (T040) are hard gates; accuracy (T042) is advisory until a real gold game lands
    # (h3_ready, H3). The judgment gate resolves a relative CORPUS_PATH against the repo
    # root, so it is CWD-independent.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install pinned Rust toolchain
        # proof-box.sh / parity.sh invoke cargo; read the channel from rust-toolchain.toml.
        run: |
          if [ -f rust-toolchain.toml ]; then rustup show; fi
      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-host-
      - name: SC-003 judgment gate (T041 — HARD-FAIL)
        run: |
          if [ -f evals/runners/judgment-gate.sh ]; then
            bash evals/runners/judgment-gate.sh evals/judgment-corpus/corpus.jsonl
          else
            echo "evals/runners/judgment-gate.sh not yet present (Squad A T041) — skipping"
          fi
      - name: Proof-box Layer-1 gate (T043 — HARD-FAIL)
        # AB+BB+Sac+HBP+INT == R+PO+LOB on the core's projection (SC-011 / INTERFACE.md §3.3 L1).
        run: |
          if [ -f evals/runners/proof-box.sh ]; then
            bash evals/runners/proof-box.sh
          else
            echo "evals/runners/proof-box.sh not yet present (Squad A T043) — skipping"
          fi
      - name: Parity gate (T040 — HARD-FAIL, SC-008)
        # CLI/agent path (persisted) vs UI/core path (in-memory replay): byte-identical.
        run: |
          if [ -f evals/runners/parity.sh ]; then
            bash evals/runners/parity.sh
          else
            echo "evals/runners/parity.sh not yet present (Squad A T040) — skipping"
          fi
      - name: Accuracy gate (T042 — ADVISORY until gold/H3)
        # SELF-CONSISTENCY mode (exit 0) until a real gold game has h3_ready=true.
        run: |
          if [ -f evals/runners/accuracy.sh ]; then
            bash evals/runners/accuracy.sh
          else
            echo "evals/runners/accuracy.sh not yet present (Squad A T042) — skipping"
          fi

  ios-build:
    name: iOS app — xcodebuild (T003 / Story B1)
    runs-on: macos-latest
    # Advisory: iOS-26 SDK is not available on GitHub-hosted macOS runners (as of 2026-06-01).
    # The cross-compile legs in cross-compile-matrix already prove Rust compiles for iOS targets.
    # xcodebuild requires the full Xcode 26.x + iOS 26 SDK, which must be self-hosted or
    # provisioned when Apple ships the runner image. Remove continue-on-error here to promote
    # this job to a hard gate once a suitable runner is confirmed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: xcodebuild (Swift 6, min iOS 26)
        # Final intent: build the ios/ Swift 6 app (min iOS 26) + run XCTest suite.
        # Requires the UniFFI XCFramework to be pre-built (or fetched from cache)
        # and placed in ios/Sources/Core/ before xcodebuild runs.
        #
        # ADVISORY — to promote to a hard gate:
        #   1. Provision a macOS runner with Xcode 26.x (iOS 26 SDK).
        #   2. Add a 'Cache XCFramework (delete-before-regenerate)' step that restores the
        #      XCFramework from a cache keyed on Cargo.lock + build-xcframework.sh checksum,
        #      OR runs `make xcframework` to rebuild it fresh, always deleting the output dir
        #      first (ADR-0009 cache-pitfall guard: non-uniffi dylib → zero bindgen output).
        #   3. Remove continue-on-error: true from this job.
        run: |
          if [ -d ios ] && ls ios/*.xcodeproj 2>/dev/null || ls ios/*.xcworkspace 2>/dev/null; then
            xcodebuild -scheme DiamondLedger -sdk iphonesimulator -destination \
              'platform=iOS Simulator,name=iPhone 16' build
          else
            echo "ios/ Xcode project not yet present — skipping iOS build (placeholder)"
          fi
