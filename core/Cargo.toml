# Package only — the workspace root is /Cargo.toml at the repo root (see PLAT-009).
[package]
name        = "dl-core"
version     = "0.1.0"
edition     = "2021"
description = "Diamond Ledger — deterministic voice-to-scorebook core (integer/fixed-point only)"
license     = "UNLICENSED"

# ADR-0007 / D1: This crate is the platform-independent deterministic moat.
# No f32/f64 anywhere in this crate — enforced by `#![deny(clippy::float_arithmetic)]`
# in src/lib.rs and the clippy.toml lint config. Ratios (AVG, OBP, …) are adapter-layer
# concerns. See plan.md "Technical Context" and research.md D1.

[lib]
name = "dl_core"
path = "src/lib.rs"
# `cdylib`/`staticlib` are required so UniFFI can emit a loadable artifact for the
# `--library` bindgen mode and the iOS XCFramework (static). `lib` keeps the crate
# usable as a normal Rust dependency by the CLI/agent adapters (parity, Art. II).
crate-type = ["lib", "staticlib", "cdylib"]

# The in-crate binding generator (T037). Only built with `--features uniffi`, so the
# default `cargo build`/`cargo test` never compiles it. Keeping it in-crate pins the
# generator to the SAME UniFFI version as the proc-macros (avoids silent skew).
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]

[features]
# UniFFI export is OPT-IN (T037 / H1). The pure core builds and tests WITHOUT it so the
# deterministic moat has zero FFI coupling by default (and the no-float clippy gate runs
# on the pure crate). The iOS XCFramework build and `uniffi-bindgen` enable this feature.
uniffi = ["dep:uniffi"]

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned (Art. XXXV). `cli` enables the `uniffi-bindgen` binary path used by the
# XCFramework build script; the proc-macros are gated behind the `uniffi` feature.
uniffi     = { version = "0.28", features = ["cli"], optional = true }

[dev-dependencies]
proptest = "1"
insta    = { version = "1", features = ["json"] }
