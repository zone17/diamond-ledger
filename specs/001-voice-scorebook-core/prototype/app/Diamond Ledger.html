<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Diamond Ledger — Voice Scorebook</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="oklch(15.5% 0.012 60)" rx="16" />
      <polygon points="50,28 64,42 50,56 36,42" fill="none" stroke="oklch(72% 0.12 175)" stroke-width="4" stroke-linejoin="round" />
      <circle cx="50" cy="72" r="8" fill="none" stroke="oklch(78% 0.155 72)" stroke-width="3.5" />
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="hud.jsx"></script>
  <script type="text/babel" src="cards.jsx"></script>
  <script type="text/babel" src="talk.jsx"></script>
  <script type="text/babel" src="woz.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script>
    // Scale the fixed 390×844 device to fit any viewport (letterboxed on the field).
    function fit() {
      var stage = document.getElementById('stage');
      if (!stage) return;
      var s = Math.min(1, (window.innerWidth - 24) / 390, (window.innerHeight - 24) / 844);
      stage.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    // re-fit once React has mounted the device
    var obs = new MutationObserver(fit);
    obs.observe(document.getElementById('root'), { childList: true, subtree: true });
    setTimeout(fit, 50); setTimeout(fit, 400);
  </script>
</body>
</html>
